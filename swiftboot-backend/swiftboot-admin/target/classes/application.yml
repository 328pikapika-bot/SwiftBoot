server:
  port: 8080
  undertow:
    threads:
      io: 4
      worker: 32
    buffer-size: 1024
    direct-buffers: true

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# Sa-Token 配置
sa-token:
  token-name: Authorization
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-print: false

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    banner: false
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Knife4j 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

# 日志配置
logging:
  level:
    com.swiftboot: debug
    org.springframework: warn
  file:
    name: ../日志检测/backend.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %thread --- [%logger{39}] : %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) %thread --- [%cyan(%logger{39})] : %msg%n"

# 文件上传配置
storage:
  type: local
  local:
    path: ./upload
    domain: http://localhost:8080/files

# AI 配置
ai:
  deepseek:
    api-url: https://api.deepseek.com/chat/completions
    api-key: sk-007917fab0564b83a47cabd191bdcda1
    model: deepseek-chat
