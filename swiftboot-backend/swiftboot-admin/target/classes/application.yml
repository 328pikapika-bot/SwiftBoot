server:
  port: 8080
  undertow:
    threads:
      io: 4
      worker: 32
    buffer-size: 1024
    direct-buffers: true

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

sa-token:
  token-name: Authorization
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-print: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    banner: false
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

springdoc:
  swagger-ui:
    enabled: ${SWIFTBOOT_SWAGGER_UI_ENABLED:false}
    path: /swagger-ui.html
  api-docs:
    enabled: ${SWIFTBOOT_API_DOCS_ENABLED:false}
    path: /v3/api-docs

knife4j:
  enable: ${SWIFTBOOT_KNIFE4J_ENABLE:false}
  setting:
    language: zh_cn

logging:
  level:
    com.swiftboot: ${SWIFTBOOT_LOG_LEVEL:info}
    org.springframework: warn
  file:
    name: ../logs/backend.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %thread --- [%logger{39}] : %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) %thread --- [%cyan(%logger{39})] : %msg%n"

storage:
  active-type: local
  access-url-expire-seconds: 900
  local:
    base-path: ./upload
    public-read: false
  minio:
    endpoint:
    access-key:
    secret-key:
    bucket:
    domain:
    public-read: false
  oss:
    endpoint:
    access-key-id:
    access-key-secret:
    bucket:
    domain:
    public-read: false
  cos:
    region:
    secret-id:
    secret-key:
    bucket:
    domain:
    public-read: false

ai:
  deepseek:
    api-url: ${SWIFTBOOT_DEEPSEEK_API_URL:https://api.deepseek.com/chat/completions}
    api-key: ${SWIFTBOOT_DEEPSEEK_API_KEY:}
    model: ${SWIFTBOOT_DEEPSEEK_MODEL:deepseek-chat}

swiftboot:
  security:
    cors:
      allowed-origin-patterns: ${SWIFTBOOT_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:30328,http://127.0.0.1:30328}
      allowed-methods: ${SWIFTBOOT_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
      allowed-headers: ${SWIFTBOOT_CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Requested-With}
      exposed-headers: ${SWIFTBOOT_CORS_EXPOSED_HEADERS:Authorization}
      allow-credentials: ${SWIFTBOOT_CORS_ALLOW_CREDENTIALS:true}
    swagger:
      public-access-enabled: ${SWIFTBOOT_SWAGGER_PUBLIC_ACCESS_ENABLED:false}
    files:
      public-access-enabled: ${SWIFTBOOT_FILES_PUBLIC_ACCESS_ENABLED:true}
      system-file-access-public-enabled: ${SWIFTBOOT_SYSTEM_FILE_ACCESS_PUBLIC_ENABLED:true}
    bootstrap-default-users-enabled: ${SWIFTBOOT_BOOTSTRAP_DEFAULT_USERS_ENABLED:false}
    bootstrap-default-password: ${SWIFTBOOT_BOOTSTRAP_DEFAULT_PASSWORD:}
