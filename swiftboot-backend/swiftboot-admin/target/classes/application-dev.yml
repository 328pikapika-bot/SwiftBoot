spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SWIFTBOOT_DB_URL:jdbc:mysql://localhost:3306/swiftboot?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SWIFTBOOT_DB_USERNAME:root}
    password: ${SWIFTBOOT_DB_PASSWORD:}
  data:
    redis:
      host: ${SWIFTBOOT_REDIS_HOST:localhost}
      port: ${SWIFTBOOT_REDIS_PORT:6379}
      password: ${SWIFTBOOT_REDIS_PASSWORD:}
      database: ${SWIFTBOOT_REDIS_DB:0}
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  swagger-ui:
    enabled: ${SWIFTBOOT_SWAGGER_UI_ENABLED:true}
  api-docs:
    enabled: ${SWIFTBOOT_API_DOCS_ENABLED:true}

knife4j:
  enable: ${SWIFTBOOT_KNIFE4J_ENABLE:true}

logging:
  level:
    com.swiftboot: ${SWIFTBOOT_LOG_LEVEL:debug}

ai:
  deepseek:
    api-url: ${SWIFTBOOT_DEEPSEEK_API_URL:https://api.deepseek.com/chat/completions}
    api-key: ${SWIFTBOOT_DEEPSEEK_API_KEY:}
    model: ${SWIFTBOOT_DEEPSEEK_MODEL:deepseek-chat}
  engine:
    vector-db-path: ./chroma_db
    collection-name: swiftboot_codebase
    memory-collection-name: swiftboot_chat_memory
    backend-log-api: ${SWIFTBOOT_AI_BACKEND_LOG_API:http://localhost:8080/monitor/operlog/inner/add}

storage:
  local:
    base-path: ${SWIFTBOOT_UPLOAD_PATH:D:/upload}

swiftboot:
  security:
    swagger:
      public-access-enabled: ${SWIFTBOOT_SWAGGER_PUBLIC_ACCESS_ENABLED:true}
